# Full local stack: MongoDB + NER service + API.
#   docker compose up -d --build      -> app on http://localhost:8080
# For API development with hot reload, run only the dependencies (docker compose up -d mongo ner)
# and start the API with `dotnet run` instead (http://localhost:5063).
services:
  mongo:
    image: mongo:8.0
    container_name: hirelens-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  ner:
    build:
      context: ./ner
      target: runtime
    image: hirelens-ner
    container_name: hirelens-ner
    restart: unless-stopped
    ports:
      - "8000:8000"

  api:
    build: ./src/HireLens.Api
    image: hirelens-api
    container_name: hirelens-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      mongo:
        condition: service_healthy
      ner:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Mongo__ConnectionString: mongodb://mongo:27017
      Mongo__DatabaseName: hirelens
      Ner__BaseUrl: http://ner:8000
      # Defaults are the development recruiter (recruiter@hirelens.dev / dev-recruiter-pass-2026).
      # Override with your own: RECRUITER_EMAIL=... RECRUITER_PASSWORD_HASH=... docker compose up -d
      Recruiter__Email: ${RECRUITER_EMAIL:-recruiter@hirelens.dev}
      Recruiter__PasswordHash: ${RECRUITER_PASSWORD_HASH:-AQAAAAIAAYagAAAAEJklJbm3jcmIkpAKzTN1GyAjMhoYYPOQKTSDFiWeDl0Cg5xq7dQxiNX+QVb6LmbW2Q==}

volumes:
  mongo-data:
