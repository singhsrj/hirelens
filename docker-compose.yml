# Local dev: MongoDB + the NER service. The API runs with `dotnet run` (it's containerised in Phase 5).
services:
  mongo:
    image: mongo:8.0
    container_name: hirelens-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  ner:
    build:
      context: ./ner
      target: runtime
    image: hirelens-ner
    container_name: hirelens-ner
    restart: unless-stopped
    ports:
      - "8000:8000"

volumes:
  mongo-data:
